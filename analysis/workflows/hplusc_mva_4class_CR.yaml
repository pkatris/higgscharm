      start: 5
      stop: 300
      label: $p_T(\ell_2^{Z_1})$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z1.l2.pt
    z1_l2_eta_2p2f:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_2^{Z_1})$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z1.l2.eta
