      start: -5
      stop: 5
      label: $\eta(Z_2)$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.p4.eta
    z2_phi_2p2f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_2)$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.p4.phi
    # Z1 leptons (2P2F)
    z1_l1_pt_2p2f:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_1})$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z1.l1.pt
    z1_l1_eta_2p2f:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_1})$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z1.l1.eta
    z1_l1_phi_2p2f:
