    z1_l1_pdgid_3p1f:
      type: IntCategory
      categories: [11, 13]
      label: Z1 l1 |pdgId| (3P1F)
      expression: np.abs(objects['best_zllcandidate_3p1f'].z1.l1.pdgId)
    # Z1 lepton ID/iso features (3P1F) -- needed by the H+c MVA's npf_candidates
    # block (lepton_charge/pfRelIso03_all/sip3d/is_tight/mvaHZZIso/isPFcand/
    # highPtId), previously never dumped -- see second-brain 2026-09-16 Z+X
    # feature-completeness check. Fields are harmonized across muon/electron
    # in select_zzto4l_leptons() (object_selections.py), safe on either flavor.
    z1_l1_istight_3p1f:
      type: Boolean
      label: Z1 l1 is_tight (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.is_tight
    z1_l1_charge_3p1f:
      type: IntCategory
      categories: [-1, 1]
      label: charge(Z1 l1) (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.charge
    z1_l1_pfreliso03all_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 2
      label: Z1 l1 PF rel. iso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.pfRelIso03_all
    z1_l1_sip3d_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 15
      label: Z1 l1 SIP3D (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.sip3d
    z1_l1_mvahzziso_3p1f:
      type: Regular
      bins: 50
      start: -999
      stop: 1
      label: Z1 l1 mvaHZZIso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.mvaHZZIso
    z1_l1_ispfcand_3p1f:
