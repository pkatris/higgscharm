# H+c MVA Control Region workflow for Z+X background estimation
#
# This workflow selects 3P1F (3 Pass + 1 Fail) and 2P2F (2 Pass + 2 Fail) events
# with all MVA features, for data-driven reducible background estimation.
#
# Control Regions:
#   CR_3P1F: Z1 (2 tight) + Z2 (1 tight + 1 relaxed-not-tight)
#   CR_2P2F: Z1 (2 tight) + Z2 (2 relaxed-not-tight)
#
# The Z+X background in signal region is estimated using fake rate method:
#   N_Z+X(SR) = sum[N_3P1F * f/(1-f)] - sum[N_2P2F * f^2/(1-f)^2]
#
# Usage:
#   python runner.py -w hplusc_mva_4class_CR -y 2022postEE -o parquet
#
# After running, use the fake rate from zplusl_ss to weight these events.

datasets:
  data:
    - muon
    - double_muon
    - electron
    - double_electron
    - muon_electron
  mc:
    - dy_nlo
    - wz
    - tt_semileptonic
    - qqtozz
    - ggtozz

object_selection:
  muons:
    field: events.Muon
    add_cut:
      is_loose:
        - events.Muon.pt > 5
        - np.abs(events.Muon.eta) < 2.4
        - np.abs(events.Muon.dxy) < 0.5
        - np.abs(events.Muon.dz) < 1
        - events.Muon.isGlobal | events.Muon.isTracker
      is_relaxed:
        - objects['muons'].is_loose
        - np.abs(events.Muon.sip3d) < 4
      is_tight:
        - objects['muons'].is_loose
        - objects['muons'].is_relaxed
        - events.Muon.isPFcand | ((events.Muon.highPtId > 0) & (events.Muon.pt > 200))
        # pfRelIso03_all < 0.35 is applied in select_zzto4l_leptons (after FSR
        # correction) -- do NOT apply here on raw iso, it double-vetoes muons
        # with a nearby FSR photon (matches zzto4l.yaml / zzto4l_CR.yaml).
  electrons:
    field: events.Electron
    add_cut:
      is_loose:
        - events.Electron.pt > 7
        - np.abs(events.Electron.eta) < 2.5
        - np.abs(events.Electron.dxy) < 0.5
        - np.abs(events.Electron.dz) < 1
      is_relaxed:
        - objects['electrons'].is_loose
        - np.abs(events.Electron.sip3d) < 4
      is_tight:
        - objects['electrons'].is_loose
        - objects['electrons'].is_relaxed
        - working_points.electron_id(events, 'bdt')
    cuts:
      - delta_r_higher(events.Electron, objects['muons'], 0.05)
  fsr_photons:
    field: events.FsrPhoton
    cuts:
      - events.FsrPhoton.pt > 2
      - np.abs(events.FsrPhoton.eta) < 2.4
      - events.FsrPhoton.relIso03 < 1.8
  leptons:
    field: select_zzto4l_leptons
  zcandidates:
    field: select_zcandidates
    add_cut:
      is_ossf:
        - objects['zcandidates'].l1.pdgId == -objects['zcandidates'].l2.pdgId
      is_sr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_tight & objects['zcandidates'].l2.is_tight
      is_1fcr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_relaxed
        - objects['zcandidates'].l2.is_relaxed
        - (1*objects['zcandidates'].l1.is_tight + 1*objects['zcandidates'].l2.is_tight) == 1
      is_2fcr:
        - objects['zcandidates'].is_ossf
        - objects['zcandidates'].l1.is_relaxed
        - objects['zcandidates'].l2.is_relaxed
        - (1*objects['zcandidates'].l1.is_tight + 1*objects['zcandidates'].l2.is_tight) == 0
      # Same-sign same-flavor Z2 candidates (for AN-18-340 Eq. 11 SS method)
      is_ss:
        - objects['zcandidates'].l1.pdgId == objects['zcandidates'].l2.pdgId
      is_2fcr_ss:
        - objects['zcandidates'].is_ss
        - objects['zcandidates'].l1.is_relaxed
        - objects['zcandidates'].l2.is_relaxed
        - (1*objects['zcandidates'].l1.is_tight + 1*objects['zcandidates'].l2.is_tight) == 0
    cuts:
      - (objects['zcandidates'].p4.mass > 12) & (objects['zcandidates'].p4.mass < 120)
  # Signal region ZZ candidates (for veto)
  zzcandidates:
    field: select_zzcandidates
    cuts:
      - objects['zzcandidates'].z1.is_sr & objects['zzcandidates'].z2.is_sr
      - (objects['zzcandidates'].z1.p4 + objects['zzcandidates'].z2.p4).mass > 70
  # Control region ZZ candidates (Z1=SR, Z2=1F or 2F)
  zllcandidates:
    field: select_zllcandidates_os
    cuts:
      - objects['zllcandidates'].z1.is_sr & (objects['zllcandidates'].z2.is_1fcr | objects['zllcandidates'].z2.is_2fcr | objects['zllcandidates'].z2.is_2fcr_ss)
      - (objects['zllcandidates'].z1.p4 + objects['zllcandidates'].z2.p4).mass > 70
  # Best CR candidates for 3P1F and 2P2F (OS-SF Z2)
  best_zllcandidate_3p1f:
    field: select_best_1fcr_zllcandidate
  best_zllcandidate_2p2f:
    field: select_best_2fcr_zllcandidate
  # Best CR candidates for 2P2F SS (SS-SF Z2, for AN-18-340 Eq. 11)
  best_zllcandidate_2p2f_ss:
    field: select_best_2fcr_ss_zllcandidate
  # Jets for MVA
  jets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
  cjets:
    field: events.Jet
    cuts:
      - events.Jet.pt > 20
      - np.abs(events.Jet.eta) < 2.5
      - working_points.jet_id(events, year, 'tightlepveto')
      - delta_r_higher(events.Jet, objects['leptons'], 0.4)
      - working_points.jet_ctagging(events, 'loose', year)

event_selection:
  hlt_paths:
    - SingleMu
    - DiMu
    - TriMu
    - SingleEle
    - DiEle
    - MuEle
  selections:
    trigger: get_zzto4l_trigger_mask(events, hlt_paths, dataset, year)
    lumimask: get_lumi_mask(events, year)
    atleast_one_goodvertex: events.PV.npvsGood > 0
    no_sr_candidate: ak.num(objects['zzcandidates']) == 0
    atleast_one_zll: ak.num(objects['zllcandidates']) >= 1
    has_3p1f: ak.num(objects['best_zllcandidate_3p1f']) >= 1
    has_2p2f: ak.num(objects['best_zllcandidate_2p2f']) >= 1
    has_2p2f_ss: ak.num(objects['best_zllcandidate_2p2f_ss']) >= 1
  categories:
    CR_3P1F:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - no_sr_candidate
      - has_3p1f
    CR_2P2F:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - no_sr_candidate
      - has_2p2f
    CR_2P2F_SS:
      - trigger
      - lumimask
      - atleast_one_goodvertex
      - no_sr_candidate
      - has_2p2f_ss

corrections:
  objects:
    - jec
    - jet_vetomaps
    - muon_ss
    - electon_ss
  event_weights:
    genWeight: true
    pileupWeight: true
    partonshowerWeight: false
    lhepdfWeight: false
    lhescaleWeight: false
    nnlopsWeight: false
    electron:
      - id: false
      - reco: true
      - trigger: false

histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    # =========================================================================
    # 4-lepton system (from control region ZZ candidate)
    # =========================================================================
    m4l_3p1f:
      type: Regular
      bins: 50
      start: 70
      stop: 400
      label: $m_{4\ell}$ (3P1F) [GeV]
      expression: (objects['best_zllcandidate_3p1f'].z1.p4 + objects['best_zllcandidate_3p1f'].z2.p4).mass
    m4l_2p2f:
      type: Regular
      bins: 50
      start: 70
      stop: 400
      label: $m_{4\ell}$ (2P2F) [GeV]
      expression: (objects['best_zllcandidate_2p2f'].z1.p4 + objects['best_zllcandidate_2p2f'].z2.p4).mass
    pT_4l_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 300
      label: $p_T(4\ell)$ (3P1F) [GeV]
      expression: (objects['best_zllcandidate_3p1f'].z1.p4 + objects['best_zllcandidate_3p1f'].z2.p4).pt
    pT_4l_2p2f:
      type: Regular
      bins: 50
      start: 0
      stop: 300
      label: $p_T(4\ell)$ (2P2F) [GeV]
      expression: (objects['best_zllcandidate_2p2f'].z1.p4 + objects['best_zllcandidate_2p2f'].z2.p4).pt

    # =========================================================================
    # Z boson masses (for control region)
    # =========================================================================
    z1_mass_3p1f:
      type: Regular
      bins: 50
      start: 40
      stop: 120
      label: $m_{Z1}$ (3P1F) [GeV]
      expression: objects['best_zllcandidate_3p1f'].z1.p4.mass
    z2_mass_3p1f:
      type: Regular
      bins: 50
      start: 12
      stop: 120
      label: $m_{Z2}$ (3P1F) [GeV]
      expression: objects['best_zllcandidate_3p1f'].z2.p4.mass
    z1_mass_2p2f:
      type: Regular
      bins: 50
      start: 40
      stop: 120
      label: $m_{Z1}$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z1.p4.mass
    z2_mass_2p2f:
      type: Regular
      bins: 50
      start: 12
      stop: 120
      label: $m_{Z2}$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z2.p4.mass

    # =========================================================================
    # Failing lepton info (for fake rate application)
    # =========================================================================
    # 3P1F: l3 and l4, one is tight, one is fail
    l3_pt_3p1f:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_3)$ (3P1F) [GeV]
      expression: objects['best_zllcandidate_3p1f'].z2.l1.pt
    l3_eta_3p1f:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_3)|$ (3P1F)
      expression: np.abs(objects['best_zllcandidate_3p1f'].z2.l1.eta)
    l3_istight_3p1f:
      type: Boolean
      label: $\ell_3$ is_tight (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.is_tight
    l3_pdgid_3p1f:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_3)|$ (3P1F)
      expression: np.abs(objects['best_zllcandidate_3p1f'].z2.l1.pdgId)
    l3_phi_3p1f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_3)$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.phi
    l3_charge_3p1f:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_3$) (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.charge
    l3_pfreliso03all_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 2
      label: $\ell_3$ PF rel. iso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.pfRelIso03_all
    l3_sip3d_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 15
      label: $\ell_3$ SIP3D (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.sip3d
    l3_mvahzziso_3p1f:
      type: Regular
      bins: 50
      start: -999
      stop: 1
      label: $\ell_3$ mvaHZZIso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.mvaHZZIso
    l3_ispfcand_3p1f:
      type: Boolean
      label: $\ell_3$ isPFcand (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.isPFcand
    l3_highptid_3p1f:
      type: Integer
      start: 0
      stop: 3
      label: $\ell_3$ highPtId (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l1.highPtId
    l4_pt_3p1f:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_4)$ (3P1F) [GeV]
      expression: objects['best_zllcandidate_3p1f'].z2.l2.pt
    l4_eta_3p1f:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_4)|$ (3P1F)
      expression: np.abs(objects['best_zllcandidate_3p1f'].z2.l2.eta)
    l4_istight_3p1f:
      type: Boolean
      label: $\ell_4$ is_tight (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.is_tight
    l4_pdgid_3p1f:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_4)|$ (3P1F)
      expression: np.abs(objects['best_zllcandidate_3p1f'].z2.l2.pdgId)
    l4_phi_3p1f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_4)$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.phi
    l4_charge_3p1f:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_4$) (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.charge
    l4_pfreliso03all_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 2
      label: $\ell_4$ PF rel. iso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.pfRelIso03_all
    l4_sip3d_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 15
      label: $\ell_4$ SIP3D (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.sip3d
    l4_mvahzziso_3p1f:
      type: Regular
      bins: 50
      start: -999
      stop: 1
      label: $\ell_4$ mvaHZZIso (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.mvaHZZIso
    l4_ispfcand_3p1f:
      type: Boolean
      label: $\ell_4$ isPFcand (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.isPFcand
    l4_highptid_3p1f:
      type: Integer
      start: 0
      stop: 3
      label: $\ell_4$ highPtId (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.l2.highPtId

    # 2P2F: both l3 and l4 are fail
    l3_pt_2p2f:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_3)$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z2.l1.pt
    l3_eta_2p2f:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_3)|$ (2P2F)
      expression: np.abs(objects['best_zllcandidate_2p2f'].z2.l1.eta)
    l3_pdgid_2p2f:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_3)|$ (2P2F)
      expression: np.abs(objects['best_zllcandidate_2p2f'].z2.l1.pdgId)
    l3_istight_2p2f:
      type: Boolean
      label: $\ell_3$ is_tight (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.is_tight
    l3_phi_2p2f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_3)$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.phi
    l3_charge_2p2f:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_3$) (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.charge
    l3_pfreliso03all_2p2f:
      type: Regular
      bins: 50
      start: 0
      stop: 2
      label: $\ell_3$ PF rel. iso (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.pfRelIso03_all
    l3_sip3d_2p2f:
      type: Regular
      bins: 50
      start: 0
      stop: 15
      label: $\ell_3$ SIP3D (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.sip3d
    l3_mvahzziso_2p2f:
      type: Regular
      bins: 50
      start: -999
      stop: 1
      label: $\ell_3$ mvaHZZIso (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.mvaHZZIso
    l3_ispfcand_2p2f:
      type: Boolean
      label: $\ell_3$ isPFcand (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.isPFcand
    l3_highptid_2p2f:
      type: Integer
      start: 0
      stop: 3
      label: $\ell_3$ highPtId (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l1.highPtId
    l4_pt_2p2f:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_4)$ (2P2F) [GeV]
      expression: objects['best_zllcandidate_2p2f'].z2.l2.pt
    l4_eta_2p2f:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_4)|$ (2P2F)
      expression: np.abs(objects['best_zllcandidate_2p2f'].z2.l2.eta)
    l4_pdgid_2p2f:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_4)|$ (2P2F)
      expression: np.abs(objects['best_zllcandidate_2p2f'].z2.l2.pdgId)
    l4_istight_2p2f:
      type: Boolean
      label: $\ell_4$ is_tight (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.is_tight
    l4_phi_2p2f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_4)$ (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.phi
    l4_charge_2p2f:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_4$) (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.charge
    l4_pfreliso03all_2p2f:
      type: Regular
      bins: 50
      start: 0
      stop: 2
      label: $\ell_4$ PF rel. iso (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.pfRelIso03_all
    l4_sip3d_2p2f:
      type: Regular
      bins: 50
      start: 0
      stop: 15
      label: $\ell_4$ SIP3D (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.sip3d
    l4_mvahzziso_2p2f:
      type: Regular
      bins: 50
      start: -999
      stop: 1
      label: $\ell_4$ mvaHZZIso (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.mvaHZZIso
    l4_ispfcand_2p2f:
      type: Boolean
      label: $\ell_4$ isPFcand (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.isPFcand
    l4_highptid_2p2f:
      type: Integer
      start: 0
      stop: 3
      label: $\ell_4$ highPtId (2P2F)
      expression: objects['best_zllcandidate_2p2f'].z2.l2.highPtId

    # =========================================================================
    # SS 2P2F: Failing lepton info (for AN-18-340 Eq. 11 SS fake rate method)
    # Z2 is same-sign same-flavor, both failing tight ID
    # =========================================================================
    m4l_2p2f_ss:
      type: Regular
      bins: 50
      start: 70
      stop: 400
      label: $m_{4\ell}$ (2P2F SS) [GeV]
      expression: (objects['best_zllcandidate_2p2f_ss'].z1.p4 + objects['best_zllcandidate_2p2f_ss'].z2.p4).mass
    l3_pt_2p2f_ss:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_3)$ (2P2F SS) [GeV]
      expression: objects['best_zllcandidate_2p2f_ss'].z2.l1.pt
    l3_eta_2p2f_ss:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_3)|$ (2P2F SS)
      expression: np.abs(objects['best_zllcandidate_2p2f_ss'].z2.l1.eta)
    l3_pdgid_2p2f_ss:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_3)|$ (2P2F SS)
      expression: np.abs(objects['best_zllcandidate_2p2f_ss'].z2.l1.pdgId)
    l3_charge_2p2f_ss:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_3$) (2P2F SS)
      expression: ak.where(objects['best_zllcandidate_2p2f_ss'].z2.l1.pdgId > 0, -1, 1)
    l4_pt_2p2f_ss:
      type: Variable
      edges: [5, 7, 10, 20, 30, 40, 50, 80]
      label: $p_T(\ell_4)$ (2P2F SS) [GeV]
      expression: objects['best_zllcandidate_2p2f_ss'].z2.l2.pt
    l4_eta_2p2f_ss:
      type: Regular
      bins: 25
      start: 0
      stop: 2.5
      label: $|\eta(\ell_4)|$ (2P2F SS)
      expression: np.abs(objects['best_zllcandidate_2p2f_ss'].z2.l2.eta)
    l4_pdgid_2p2f_ss:
      type: IntCategory
      categories: [11, 13]
      label: $|\text{pdgId}(\ell_4)|$ (2P2F SS)
      expression: np.abs(objects['best_zllcandidate_2p2f_ss'].z2.l2.pdgId)
    l4_charge_2p2f_ss:
      type: IntCategory
      categories: [-1, 1]
      label: charge($\ell_4$) (2P2F SS)
      expression: ak.where(objects['best_zllcandidate_2p2f_ss'].z2.l2.pdgId > 0, -1, 1)

    # =========================================================================
    # Jet features (for MVA)
    # =========================================================================
    jet_multiplicity:
      type: Integer
      start: 0
      stop: 14
      label: Jet Multiplicity
      expression: ak.num(objects['jets'])
    n_cjet:
      type: Integer
      start: 0
      stop: 14
      label: c-Jet Multiplicity
      expression: ak.num(objects['cjets'])
    jet_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: Jets $p_T$ [GeV]
      expression: objects['jets'].pt
    jet_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: Jets $\eta$
      expression: objects['jets'].eta
    jet_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: Jets $\phi$
      expression: objects['jets'].phi
    jet_btagPNetB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet B
      expression: objects['jets'].btagPNetB
    jet_btagPNetCvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvL
      expression: objects['jets'].btagPNetCvL
    jet_btagPNetCvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: Jets PNet CvB
      expression: objects['jets'].btagPNetCvB
    cjets_pt:
      type: Regular
      bins: 50
      start: 20
      stop: 500
      label: c-Jet $p_T$ [GeV]
      expression: objects['cjets'].pt
    cjets_eta:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: c-Jet $\eta$
      expression: objects['cjets'].eta
    cjets_phi:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: c-Jet $\phi$
      expression: objects['cjets'].phi
    cjets_btagPNetB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet B
      expression: objects['cjets'].btagPNetB
    cjets_btagPNetCvL:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet CvL
      expression: objects['cjets'].btagPNetCvL
    cjets_btagPNetCvB:
      type: Regular
      bins: 50
      start: 0
      stop: 1
      label: c-Jets PNet CvB
      expression: objects['cjets'].btagPNetCvB

    # =========================================================================
    # Additional MVA features for inference (mirroring hplusc_mva_4class)
    # =========================================================================

    # --- Jet global ---
    jet_ht:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (Jets) [GeV]
      expression: ak.sum(objects['jets'].pt, axis=1)
    cjet_HT:
      type: Regular
      bins: 50
      start: 0
      stop: 1000
      label: $H_T$ (c-Jets) [GeV]
      expression: ak.sum(objects['cjets'].pt, axis=1)
    nSV:
      type: Integer
      start: 0
      stop: 10
      label: Number of Secondary Vertices
      expression: ak.num(events.SV)

    # --- 3P1F: ZZ system kinematics ---
    eta_4l_3p1f:
      type: Regular
      bins: 50
      start: -5
      stop: 5
      label: $\eta(4\ell)$ (3P1F)
      expression: (objects['best_zllcandidate_3p1f'].z1.p4 + objects['best_zllcandidate_3p1f'].z2.p4).eta
    phi_4l_3p1f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
