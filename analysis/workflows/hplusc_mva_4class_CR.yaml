    deltaR_ZZ_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 6
      label: $\Delta R(Z_1, Z_2)$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.p4.delta_r(objects['best_zllcandidate_3p1f'].z2.p4)
    z1_pt_3p1f:
      type: Regular
      bins: 50
      start: 0
      stop: 500
      label: $p_T(Z_1)$ (3P1F) [GeV]
