    zll_3p1f:
      - m4l_3p1f
      - pT_4l_3p1f
      - eta_4l_3p1f
      - phi_4l_3p1f
      - z1_mass_3p1f
      - z2_mass_3p1f
    z_kinematics_3p1f:
      - z1_pt_3p1f
      - z1_eta_3p1f
      - z1_phi_3p1f
      - z2_pt_3p1f
      - z2_eta_3p1f
      - z2_phi_3p1f
      - deltaR_ZZ_3p1f
    z1_leptons_3p1f:
