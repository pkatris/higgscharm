      start: -5
      stop: 5
      label: $\eta(Z_2)$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.p4.eta
    z2_phi_3p1f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(Z_2)$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z2.p4.phi
    # Z1 leptons (3P1F)
    z1_l1_pt_3p1f:
      type: Regular
      bins: 50
      start: 5
      stop: 300
      label: $p_T(\ell_1^{Z_1})$ (3P1F) [GeV]
      expression: objects['best_zllcandidate_3p1f'].z1.l1.pt
    z1_l1_eta_3p1f:
      type: Regular
      bins: 50
      start: -2.5
      stop: 2.5
      label: $\eta(\ell_1^{Z_1})$ (3P1F)
      expression: objects['best_zllcandidate_3p1f'].z1.l1.eta
    z1_l1_phi_3p1f:
      type: Regular
      bins: 50
      start: -3.14159
      stop: 3.14159
      label: $\phi(\ell_1^{Z_1})$ (3P1F)
